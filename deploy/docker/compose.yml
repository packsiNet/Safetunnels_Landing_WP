name: safetunnels
services:
  db:
    image: ${DATABASE_IMAGE:?Pinned database image required}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes: [database:/var/lib/mysql]
    networks: [backend]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  wordpress:
    image: ${WORDPRESS_IMAGE:?Pinned WordPress image required}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:${HTTP_PORT:-18080}:80']
    environment: &wp_environment
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      APP_URL: ${APP_URL:?Canonical URL required}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', getenv('APP_URL'));
        define('WP_SITEURL', getenv('APP_URL'));
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    secrets: [db_password]
    volumes: &wp_volumes
      - wordpress:/var/www/html
      - ${THEME_RELEASE:?Theme release required}:/var/www/html/wp-content/themes/safetunnels:ro
    networks: [backend, outbound]
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',80) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: [no-new-privileges:true]
    logging: *logging
  cli:
    image: ${CLI_IMAGE:?Pinned CLI image required}
    profiles: [tools]
    user: '33:33'
    environment:
      <<: *wp_environment
      HOME: /tmp
    secrets: [db_password, admin_password]
    volumes: *wp_volumes
    networks: [backend, outbound]
    entrypoint: [wp, --path=/var/www/html, --no-color]
    logging: *logging
secrets:
  db_password: {file: ./secrets/db_password}
  db_root_password: {file: ./secrets/db_root_password}
  admin_password: {file: ./secrets/admin_password}
volumes:
  database:
  wordpress:
networks:
  backend: {internal: true}
  outbound:
